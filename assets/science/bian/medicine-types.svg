<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-label="Six numbered medicine types"><rect width="900" height="420" fill="white"/><style>.n{font:700 26px Arial;fill:#222}.f{fill:#fff;stroke:#333;stroke-width:2}.o{stroke:#263238;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.thin{stroke:#263238;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}</style>
