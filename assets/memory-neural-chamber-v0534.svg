<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Neural toy lab chamber background">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071d3c"/>
      <stop offset="0.48" stop-color="#112e5d"/>
      <stop offset="1" stop-color="#33275f"/>
    </linearGradient>
    <radialGradient id="ceiling" cx="50%" cy="0%" r="78%">
      <stop offset="0" stop-color="#8fefff" stop-opacity=".50"/>
      <stop offset=".30" stop-color="#8b9cff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#0b1f42" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cyan" x1="0" x2="1">
      <stop stop-color="#5ff2df"/>
      <stop offset="1" stop-color="#7aa6ff"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" x2="1">
      <stop stop-color="#ffd86f"/>
      <stop offset="1" stop-color="#ff87ba"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#8bdcf4" stop-opacity=".18"/>
      <stop offset="1" stop-color="#192b57" stop-opacity=".78"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#ceiling)"/>

  <!-- curved chamber walls -->
  <path d="M0 85 Q250 10 515 65 L460 810 Q225 865 0 780Z" fill="#0b254d" opacity=".72"/>
  <path d="M1600 85 Q1350 10 1085 65 L1140 810 Q1375 865 1600 780Z" fill="#181f4c" opacity=".78"/>
  <path d="M42 138 Q265 70 438 112" fill="none" stroke="#75ddff" stroke-width="10" opacity=".12"/>
  <path d="M1558 138 Q1335 70 1162 112" fill="none" stroke="#c497ff" stroke-width="10" opacity=".12"/>

  <!-- ceiling neural projector -->
  <ellipse cx="800" cy="54" rx="270" ry="72" fill="#25396f" stroke="#8ee6ff" stroke-opacity=".28" stroke-width="4"/>
  <ellipse cx="800" cy="54" rx="186" ry="42" fill="#86e8ff" opacity=".10" filter="url(#glow)"/>
  <path d="M610 12 Q640 96 700 142" fill="none" stroke="#ffd985" stroke-width="14" opacity=".60" filter="url(#glow)"/>
  <path d="M990 12 Q960 96 900 142" fill="none" stroke="#ffd985" stroke-width="14" opacity=".60" filter="url(#glow)"/>
  <path d="M800 54 C760 54 735 77 735 106 C735 131 753 145 772 147 C784 164 816 164 828 147 C848 144 865 130 865 106 C865 77 840 54 800 54Z" fill="none" stroke="#a2f4ff" stroke-width="8" opacity=".80" filter="url(#glow)"/>
  <path d="M800 75v56M774 89c18 8 34 8 52 0M778 116c16-8 28-8 44 0" fill="none" stroke="#b9f7ff" stroke-width="5" stroke-linecap="round" opacity=".76"/>

  <!-- side lab consoles -->
  <g opacity=".90">
    <path d="M0 545 L255 492 Q308 486 338 536 L352 710 L0 760Z" fill="#111e43"/>
    <path d="M20 566 L251 522 Q282 520 300 548 L307 648 L0 687Z" fill="url(#panel)" stroke="#67d6ef" stroke-opacity=".25" stroke-width="3"/>
    <rect x="58" y="576" width="105" height="60" rx="14" fill="#1c315f" stroke="#71e2ef" stroke-opacity=".30"/>
    <path d="M76 613 Q103 584 126 611 T154 597" fill="none" stroke="url(#cyan)" stroke-width="4"/>
    <circle cx="215" cy="575" r="12" fill="#ffcf5f"/><circle cx="249" cy="569" r="8" fill="#62e4c1"/>
  </g>
  <g opacity=".90" transform="translate(1600 0) scale(-1 1)">
    <path d="M0 545 L255 492 Q308 486 338 536 L352 710 L0 760Z" fill="#111e43"/>
    <path d="M20 566 L251 522 Q282 520 300 548 L307 648 L0 687Z" fill="url(#panel)" stroke="#bb8cff" stroke-opacity=".26" stroke-width="3"/>
    <rect x="58" y="576" width="105" height="60" rx="14" fill="#2b2458" stroke="#d194ff" stroke-opacity=".30"/>
    <path d="M76 613 Q103 584 126 611 T154 597" fill="none" stroke="url(#warm)" stroke-width="4"/>
    <circle cx="215" cy="575" r="12" fill="#ff88b8"/><circle cx="249" cy="569" r="8" fill="#77dff1"/>
  </g>

  <!-- back shelves and science props -->
  <g opacity=".52">
    <rect x="96" y="240" width="180" height="28" rx="14" fill="#6582bd"/>
    <circle cx="130" cy="218" r="26" fill="#75e5d5" opacity=".55"/>
    <rect x="174" y="185" width="24" height="53" rx="8" fill="#ffc765"/>
    <rect x="210" y="198" width="18" height="40" rx="7" fill="#d789ff"/>
    <rect x="1324" y="240" width="180" height="28" rx="14" fill="#705aaf"/>
    <circle cx="1470" cy="210" r="29" fill="#ff8fc0" opacity=".52"/>
    <rect x="1380" y="185" width="25" height="53" rx="8" fill="#63e4c2"/>
    <rect x="1418" y="199" width="18" height="39" rx="7" fill="#8cb5ff"/>
  </g>

  <!-- floating puzzle pieces -->
  <g filter="url(#glow)">
    <path d="M118 154h34c-5-21 25-29 29-8 2 10-5 16-12 18v28h-29c2 10-4 20-15 20-14 0-20-15-12-25 2-3 5-5 9-6v-27Z" fill="#ffcf62" opacity=".82"/>
    <path d="M1450 294h30c-3-17 21-25 26-8 3 9-3 15-9 18v26h-27c2 9-4 18-14 18-13 0-19-13-12-23 2-3 5-5 9-6v-25Z" fill="#62e7d4" opacity=".78"/>
    <path d="M260 302h24c-3-14 17-20 21-7 2 8-2 12-8 15v21h-21c2 8-3 15-11 15-10 0-15-10-9-18 2-2 4-3 7-4v-22Z" fill="#cf8cff" opacity=".72"/>
  </g>

  <!-- floor platform and depth -->
  <ellipse cx="800" cy="812" rx="520" ry="78" fill="#06162e" opacity=".78" filter="url(#soft)"/>
  <ellipse cx="800" cy="780" rx="500" ry="84" fill="#33427a" stroke="#8dcfff" stroke-opacity=".28" stroke-width="4"/>
  <ellipse cx="800" cy="767" rx="405" ry="58" fill="#192c59" stroke="#ffd284" stroke-opacity=".38" stroke-width="7"/>
  <ellipse cx="800" cy="758" rx="300" ry="36" fill="#76dfff" opacity=".10" filter="url(#glow)"/>
  <rect x="510" y="780" width="120" height="10" rx="5" fill="#5de8e4" opacity=".75" filter="url(#glow)"/>
  <rect x="970" y="780" width="120" height="10" rx="5" fill="#d28cff" opacity=".72" filter="url(#glow)"/>

  <!-- ambient particles -->
  <g fill="#fff" opacity=".72">
    <circle cx="410" cy="147" r="3"/><circle cx="512" cy="214" r="2"/><circle cx="1114" cy="188" r="3"/><circle cx="1240" cy="142" r="2"/>
    <circle cx="356" cy="430" r="3"/><circle cx="1268" cy="430" r="3"/><circle cx="534" cy="684" r="2"/><circle cx="1082" cy="690" r="2"/>
  </g>
</svg>